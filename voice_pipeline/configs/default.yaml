backend:
  # Both values are supplied at runtime and must never be committed.
  #
  #   url   -> VOICE_AGENT_BACKEND_URL, the Cloud Run backend base URL
  #   token -> VOICE_AGENT_JWT, a backend-issued JWT, provided as a Modal
  #            secret when the voice agent is deployed
  #
  # voice_pipeline/utils/config.py reads those environment variables first and
  # only falls back to the keys below. They are deliberately left empty: with
  # nothing in the environment, load_voice_config() raises a clear ValueError
  # at config.py:97-100 instead of silently talking to the wrong backend.
  #
  # A previous revision of this file hardcoded a super-admin JWT for a
  # university group project. That token and backend are both dead, and the
  # token should be treated as compromised since it is in git history.
  url: ""
  token: ""

livekit:
  stt:
    primary:
      provider: "deepgram"
      model: "nova-2-general"
    fallbacks:
      - provider: "assemblyai"
        model: "default"
        kwargs: {}
  llm:
    primary:
      provider: "openai"
      model: "gpt-4o-mini"
    fallbacks: []
  tts:
    primary:
      provider: "deepgram"
      model: "aura-2-thalia-en"
    fallbacks: 
     - provider: "cartesia"
       model: "sonic-2"
  vad:
    provider: "silero"
    kwargs:
      min_silence_duration: 0.3
      min_speech_duration: 0.1
