name: Deployment Pipeline - Deploy Backend to Cloud Run

on:
  # Manual button, so a deploy can always be forced from the Actions tab.
  workflow_dispatch:

  # Direct trigger on main. The CI workflow this used to chain off only fires
  # on pull_request and workflow_dispatch, which meant the workflow_run link
  # below could never actually fire and no deploy ever happened. Paths are
  # limited to the inputs that genuinely change the backend image.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/requirements.txt'
      - 'chat_pipeline/**'
      - 'data_pipeline/data/vector_db/**'
      - 'Dockerfile.backend'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'

  # Retained so that a green CI run on main still promotes automatically if
  # push triggers are ever restored to the CI workflow.
  workflow_run:
    workflows: ["Deployment Pipeline - Backend CI Tests"]
    branches: [main]
    types:
      - completed

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: frontshiftai-backend
  REPOSITORY: frontshiftai-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Two gates.
    #
    # DEPLOY_BACKEND_ENABLED is a repo variable acting as an on switch. Until
    # the GCP project, Workload Identity and Secret Manager entries exist, a
    # deploy can only fail, and a failing run on every push to main is just
    # notification noise. Set the variable to 'true' once the infrastructure
    # is in place. A secret cannot be used here because the secrets context
    # is not available in a job-level if.
    #
    # The workflow_run conclusion is only meaningful for the chained event.
    # For push and workflow_dispatch there is no workflow_run payload, and
    # gating on it unconditionally would skip the job every time.
    if: >-
      vars.DEPLOY_BACKEND_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_run supplies the CI commit; push and workflow_dispatch
          # fall back to the SHA that triggered this run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        run: |
          echo "IMAGE_SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af
          df -h

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ env.IMAGE_SHA }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest \
            -f Dockerfile.backend \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ env.IMAGE_SHA }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest

      # Database is Neon serverless Postgres, reached over plain TLS from the
      # public internet. DATABASE_URL is an ordinary Secret Manager secret
      # holding the full Neon connection string (which already carries
      # sslmode=require), so there is no Cloud SQL connector to attach.
      # --clear-cloudsql-instances makes the migration idempotent: gcloud run
      # deploy otherwise inherits the previous revision's settings, so simply
      # dropping the old --add-cloudsql-instances flag would leave a stale
      # attachment behind on a pre-existing service.
      #
      # Sizing: measured steady-state RSS is roughly 0.8 to 1.2GB, so 2Gi/2CPU
      # replaces the previous 4Gi/4CPU. min-instances stays at 0 to avoid
      # idle billing; expect a cold start while torch and the MiniLM embedding
      # model load.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ env.IMAGE_SHA }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars ENVIRONMENT=production,GENERATION_BACKEND=mercury \
            --set-secrets GROQ_API_KEY=GROQ_API_KEY:latest,BRAVE_API_KEY=BRAVE_API_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,INCEPTION_API_KEY=INCEPTION_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,SEED_SUPER_ADMIN_PASSWORD=SEED_SUPER_ADMIN_PASSWORD:latest,SEED_ADMIN_PASSWORD=SEED_ADMIN_PASSWORD:latest,SEED_USER_PASSWORD=SEED_USER_PASSWORD:latest,SEED_DEMO_PASSWORD=SEED_DEMO_PASSWORD:latest \
            --clear-cloudsql-instances \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0

      - name: Verify deployment health
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" --format 'value(status.url)')
          echo "Probing $SERVICE_URL/health/ready"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null --max-time 10 -w "%{http_code}" \
              "$SERVICE_URL/health/ready")
            if [ "$STATUS" = "200" ]; then
              echo "Healthy after ~$((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/18: /health/ready returned $STATUS"
            sleep 5
          done
          echo "Health check failed - rolling back to previous revision"
          PREV_REVISION=$(gcloud run revisions list --service "$SERVICE_NAME" \
            --region "$REGION" --format 'value(metadata.name)' \
            --sort-by '~metadata.creationTimestamp' | sed -n 2p)
          if [ -n "$PREV_REVISION" ]; then
            gcloud run services update-traffic "$SERVICE_NAME" --region "$REGION" \
              --to-revisions "$PREV_REVISION=100"
            echo "Traffic routed back to $PREV_REVISION"
          else
            echo "No previous revision exists - nothing to roll back to"
          fi
          exit 1

      - name: Show deployment URL
        run: |
          echo "Deployment successful!"
          gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)'