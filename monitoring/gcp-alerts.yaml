displayName: "FrontShiftAI Critical Alerts"
combiner: OR
conditions:
  - displayName: "High Error Rate (5xx)"
    conditionThreshold:
      filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="frontshiftai-backend" AND metric.type="run.googleapis.com/request_count" AND metric.labels.response_code_class="5xx"'
      comparison: COMPARISON_GT
      thresholdValue: 10
      duration: 300s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
    
  - displayName: "High Response Latency"
    conditionThreshold:
      filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="frontshiftai-backend" AND metric.type="run.googleapis.com/request_latencies"'
      comparison: COMPARISON_GT
      thresholdValue: 3000
      duration: 300s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_DELTA
          crossSeriesReducer: REDUCE_PERCENTILE_95
    
  - displayName: "High CPU Usage"
    conditionThreshold:
      filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="frontshiftai-backend" AND metric.type="run.googleapis.com/container/cpu/utilizations"'
      comparison: COMPARISON_GT
      thresholdValue: 0.8
      duration: 300s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_DELTA
          crossSeriesReducer: REDUCE_PERCENTILE_95

notificationChannels:
  # Placeholder. The previous value pointed at a notification channel in the
  # old university group's GCP project and is not reachable any more.
  #
  # Substitute both parts below with values from your own project:
  #   PROJECT_ID           your GCP project id (same one the backend deploys to)
  #   NOTIFICATION_CHANNEL the numeric channel id
  #
  # Create a channel and list the ids with:
  #   gcloud beta monitoring channels create \
  #     --display-name="FrontShiftAI alerts" \
  #     --type=email \
  #     --channel-labels=email_address=YOU@example.com
  #   gcloud beta monitoring channels list --format='value(name)'
  #
  # Leaving this placeholder in place means alerts fire but notify nobody.
  - projects/PROJECT_ID/notificationChannels/NOTIFICATION_CHANNEL

alertStrategy:
  autoClose: 1800s